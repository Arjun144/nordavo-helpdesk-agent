[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roosterly-helpdesk-agent"
version = "0.1.0"
description = "Agent that triages Roosterly helpdesk tickets and posts one decision per ticket"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.7", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
